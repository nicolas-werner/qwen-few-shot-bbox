[project]
name = "phd-boxprompt"
version = "0.1.0"
description = "Box-prompt annotation and few-shot detection experiments on medieval manuscript folios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anywidget>=0.9.13",
    "marimo>=0.13.0",
    "openai>=1.60.0",
    "pillow>=10.4.0",
    "python-dotenv>=1.0.1",
    "traitlets>=5.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phd_boxprompt"]

[tool.ruff]
line-length = 100
target-version = "py311"
# generated file: duplicate imports inside one cell are legal and expected
extend-exclude = ["notebooks/box_prompt_standalone.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint.per-file-ignores]
# marimo cells render by ending on a bare expression
"notebooks/*.py" = ["B018"]
